name: Build, lint, test, package and publish

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: [ 3.7, 3.8, 3.9 ]
    steps:
      - uses: actions/checkout@v4.1.4
      - name: Determine version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            version="${GITHUB_REF##*/}"
          else
            version="1.0.dev${{ github.run_id }}"
          fi
          echo "Setting version to $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5.1.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install poetry
        run: python -m pip install "poetry==1.5.1"

      - name: Set version
        run: |
          python -m poetry version ${{ steps.get_version.outputs.version }}
          sed -i "s/\"1.0.dev0\"/\"${{ steps.get_version.outputs.version }}\"/g" clin/__init__.py

      - name: Install dependencies
        run: python -m poetry install

      - name: Run linter
        run: python -m poetry run black clin --check

      - name: Build packages
        run: python -m poetry build

      - name: Run tests
        run: python -m poetry run pytest

      - name: Publish to PyPI
        if: github.event_name == 'release' && matrix.python-version == '3.7'
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_TOKEN }}
        run: python -m poetry publish
